seed: 1
work_dir: ./exp/hypergcn/ntu11_xview_chase
run_mode: train

# feeder
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu/NTU60_CV.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False
  random_spatial_shift: True

test_feeder_args:
  data_path: data/ntu/NTU60_CV.npz
  split: test  
  debug: False
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False

# model
wrapper: model.Wrapper.chas.CHASWrapper
wrapper_args:
  in_channels: 3 
  num_frame: 64
  num_point: 25
  num_entity: 2
  pooling_seg: [1,1,1]
  c1: 64
  c2: 8
model: model.HyperGCN.hypergcn_large.Model
model_args:
  num_class: 11
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: model.HyperGCN.graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

#optim
optimizer: SGD
weight_decay: 0.0004
base_lr: 0.025
lr_decay_rate: 0.1
step: [110, 120]
warm_up_epoch: 5
nesterov: True

# loss
loss: HyperGCN_Loss_MBMMD
loss_args:
  weights: [1.0, 1.0, 0.1]
  smoothing: 0.1
  temperature: 1.0

# training
device: [0,1]
cuda_visible_device: '4,5'
batch_size: 64
test_batch_size: 64
num_epoch: 140